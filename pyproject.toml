[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "botconnectserver"
version = "1.0.0"
description = "A small authenticated asyncio TCP message server"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0"]

[tool.setuptools]
packages = ["botconnectserver"]

[tool.setuptools.package-data]
botconnectserver = ["web_dist/**/*"]

[project.scripts]
botconnectserver = "botconnectserver.server:main"
